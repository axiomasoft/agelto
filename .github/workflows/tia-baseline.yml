name: TIA baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tia-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV_FILE: .env.example

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-core-test
      - name: Record and export one complete TIA graph
        id: tia
        run: |
          result=$(make core-test-tia)
          printf '%s\n' "$result"
          printf 'path=%s/tia-baseline\n' "$(jq -r .evidence <<< "$result")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pest-tia-baseline
          path: ${{ steps.tia.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
