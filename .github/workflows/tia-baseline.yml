name: TIA baseline

# The graph only changes when PHP sources or tests change, so a push that touches neither
# does not re-record it. The weekly run keeps the 30-day artifact alive on quiet weeks.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.lock'
      - 'phpunit.xml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tia-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV_FILE: .env.example

jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-core-test
      - name: Record and export one complete TIA graph
        id: tia
        run: |
          result=$(make core-test-tia)
          printf '%s\n' "$result"
          printf 'path=%s/tia-baseline\n' "$(jq -r .evidence <<< "$result")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-tia-baseline
          path: ${{ steps.tia.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
