name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: agelto_ci_${{ github.run_id }}_${{ github.job }}
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  quality:
    name: Quality and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.17.1'
      - name: Enable locked pnpm
        run: corepack enable
      - id: composer-cache
        name: Resolve Composer download cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ runner.arch }}-php85-${{ hashFiles('composer.lock') }}
      - id: pnpm-cache
        name: Resolve pnpm download cache
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Bootstrap trusted local carrier
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
        run: bash docker/scripts/ci-private-dependency-preflight.sh make bootstrap MODE=dev ENV_FILE=.env
      - name: Run local quality carrier
        run: make quality
      - name: Save Composer download cache on trusted push
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ runner.arch }}-php85-${{ hashFiles('composer.lock') }}
      - name: Save pnpm download cache on trusted push
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

  tests:
    name: Full no-TIA tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
      - name: Bootstrap trusted local carrier
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
        run: bash docker/scripts/ci-private-dependency-preflight.sh make bootstrap MODE=dev ENV_FILE=.env
      - name: Run full no-TIA JUnit carrier
        run: make test:junit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-${{ github.job }}-${{ github.sha }}
          path: storage/app/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage floor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
      - name: Bootstrap trusted local carrier
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
        run: bash docker/scripts/ci-private-dependency-preflight.sh make bootstrap MODE=dev ENV_FILE=.env
      - name: Run no-TIA coverage carrier
        run: make test:coverage
      - name: Enforce release coverage floors
        run: |
          python3 docker/scripts/coverage-gate.py --clover storage/app/coverage/clover.xml \
            --critical-file app/Services/Documentation/PrivateDocumentationLocator.php \
            --critical-file app/Services/Health/ApplicationReadiness.php \
            --critical-file app/Services/Procurement/Prepare/Archive/ArchiveEntryValidator.php \
            --critical-file app/Services/Procurement/Proxy/ProxyResolver.php \
            --critical-file app/Actions/Procurement/Screening/ApplyScreeningDispositionAction.php
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: |
            storage/app/coverage/clover.xml
            storage/app/coverage/junit.xml
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Playwright acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.17.1'
      - name: Enable locked pnpm
        run: corepack enable
      - name: Run isolated D24 carrier
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
          E2E_ARTIFACT_DIR: .ci-artifacts
        run: bash docker/scripts/ci-private-dependency-preflight.sh bash docker/tests/clean-install-e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-${{ github.sha }}
          path: .ci-artifacts/playwright-report/index.html
          if-no-files-found: error
          retention-days: 14

  build-security:
    name: Immutable build and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.17.1'
      - name: Enable locked pnpm
        run: corepack enable
      - name: Prepare private package source
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
        run: bash docker/scripts/ci-private-dependency-preflight.sh make vendor:sync
      - name: Audit locked dependencies
        run: |
          composer audit --locked --no-interaction
          pnpm audit --audit-level=high
      - name: Build immutable image pair
        run: make image:build IMAGE_TAG=${{ env.IMAGE_TAG }}
      - uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: agelto/app:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          cache: false

  release-quality:
    name: Release quality evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
      - name: Bootstrap trusted local carrier
        env:
          AZGUARD_CI_TOKEN: ${{ secrets.AZGUARD_CI_TOKEN }}
        run: bash docker/scripts/ci-private-dependency-preflight.sh make bootstrap MODE=dev ENV_FILE=.env
      - name: Collect D40/D42 no-TIA release evidence
        run: make test:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-quality-${{ github.sha }}
          path: .ci-artifacts/release-quality
          if-no-files-found: error
          retention-days: 14
