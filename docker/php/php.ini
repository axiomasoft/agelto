; PHP Configuration for File Uploads
; Увеличиваем лимиты для загрузки больших файлов (видео)

; Максимальный размер загружаемого файла
upload_max_filesize = 200M

; Максимальный размер POST данных (должен быть больше upload_max_filesize)
post_max_size = 210M

; Максимальное время выполнения скрипта (в секундах)
max_execution_time = 300

; Максимальное время загрузки файла (в секундах)
max_input_time = 300

; Максимальное количество загружаемых файлов одновременно
max_file_uploads = 20

; Лимит памяти (уже должен быть достаточным, но на всякий случай)
memory_limit = 256M

