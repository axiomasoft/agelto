; Dev-override для docker/php/conf.d/pcov.ini (docs/dev/process/testing.md §Tia): в проде
; pcov.enabled=0 остаётся zero-cost (тот файл в Dockerfile общий для dev/prod, COPY на этапе
; сборки образа). Здесь — bind-mount ТОЛЬКО в docker-compose.yml (dev), поверх того же пути
; /usr/local/etc/php/conf.d/pcov.ini, без пересборки образа и без изменения prod-конфига.
;
; pcov.enabled=1 постоянно (не через -d при вызове) — устраняет саму причину, по которой Tia
; теряла флаг: Pest\Restarters\PcovRestarter перезапускает воркер с -d pcov.directory=<root>
; ТОЛЬКО (не -d pcov.enabled=1), рассчитывая, что pcov.enabled уже верен в php.ini
; перезапущенного процесса — что и обеспечивает этот файл. pcov.directory задан явно (не auto),
; поэтому PcovRestarter видит совпадение с project root и вовсе не перезапускает процесс.
pcov.enabled=1
pcov.directory=/var/www/html
pcov.exclude="~(vendor|storage|node_modules)~"
