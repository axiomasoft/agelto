version: "3.9"

services:
  app:
    image: agelto/app:latest
    container_name: agelto_app
    restart: unless-stopped
    working_dir: /var/www/html
    shm_size: '2gb'
    ports:
      - "${APP_PORT:-8081}:80"
    environment: &prod_env
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [ agelto_network ]

  worker-eis-crawling:
    image: agelto/app:latest
    container_name: agelto_worker_eis_crawling
    restart: unless-stopped
    shm_size: '2gb'
    command: php artisan queue:work redis --queue=default,crawling --sleep=3 --tries=3
    environment: *prod_env
    depends_on: [ mysql, redis ]
    networks: [ agelto_network ]

  mysql:
    image: mysql:8.4
    container_name: agelto_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ agelto_network ]

  redis:
    image: redis:alpine
    networks: [ agelto_network ]

networks:
  agelto_network:
    driver: bridge

volumes:
  mysql_data:
