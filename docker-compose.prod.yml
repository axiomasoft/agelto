version: "3.9"

services:
  app:
    image: agelto/app:latest
    container_name: agelto_app
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # Laravel
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}

      # Database
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Cache / Session / Queue
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}

    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agelto_network

  queue:
    image: agelto/app:latest
    container_name: agelto_queue
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - agelto_network

  scheduler:
    image: agelto/app:latest
    container_name: agelto_scheduler
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - agelto_network

  reverb:
    image: agelto/app:latest
    container_name: agelto_reverb
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8000
    ports:
      - "${REVERB_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - agelto_network

  mysql:
    image: mysql:8.4
    container_name: agelto_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agelto_network

networks:
  agelto_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
