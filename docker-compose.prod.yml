name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  doctor:
    image: agelto/doctor:${IMAGE_TAG:?IMAGE_TAG is required}
    profiles: [doctor]
    working_dir: /var/www/html
    secrets:
      - app_key
      - db_password
      - redis_password
      - minio_root_password
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_KEY_FILE: /run/secrets/app_key
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agelto}
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-agelto}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    networks:
      - agelto_network

  app:
    image: agelto/app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    # File-backed secrets are generated into ignored local/secrets/.
    secrets:
      - app_key
      - db_password
      - redis_password
      - minio_root_password
    environment: &prod_env
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agelto}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-agelto}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AI_FIXTURES_DISK: estimates_s3
      AWS_ESTIMATES_BUCKET: ${MINIO_ESTIMATES_BUCKET:-agelto-estimates}
      # Указываем пути к файлам secrets — entrypoint читает их в APP_KEY / DB_PASSWORD / REDIS_PASSWORD / AWS_SECRET_ACCESS_KEY
      APP_KEY_FILE: /run/secrets/app_key
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - agelto_network

  horizon:
    image: agelto/app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    # The FPM/Nginx base image uses SIGQUIT; Horizon listens for SIGTERM.
    stop_signal: SIGTERM
    # Инвариант D26 (plans/EST-AI/plan.md; research/J §2): job timeout < supervisor timeout
    # (config/horizon.php; самый длинный pipeline supervisor — doc_prepare=2640s, а OCR job
    # ограничен 2580s; extraction checkpoints at 120s before its next 150s call)
    # < queue.retry_after (config/queue.php, redis_prepare.retry_after=2700s) — И ОТДЕЛЬНО:
    # stop_grace_period здесь ОБЯЗАН быть > самого длинного supervisor-таймаута, иначе Docker
    # SIGKILL'ит контейнер раньше, чем horizon:terminate успевает дождаться текущих jobs
    # (Docker default 10s убил бы 300+с job — research/J §2). 600s — канон research/J §2
    # (диапазон 600–3600s); env-параметризуемо под будущую калибровку.
    # P4.7 (D117): long archive lane держит одну job до 3600s; её logical Redis connection
    # возвращает reserved job после 3900s. Grace обязан быть больше обоих, иначе Docker SIGKILL
    # прервёт Horizon раньше контролируемого завершения. Изменение требует новой D-записи.
    stop_grace_period: ${HORIZON_STOP_GRACE_PERIOD:-4200s}
    working_dir: /var/www/html
    # Решение P7.4 (F-11 называет это дремлющим дефектом — Postgres нуждается в shm, не
    # PHP-воркер): блок ОСТАЁТСЯ здесь как есть, а не переносится. CLAUDE.md («Очереди: Laravel
    # Horizon») резервирует этот контейнер под будущую браузерную автоматизацию
    # (`shm_size`/`CHROME_BIN`, Фаза 8 — Playwright/Chromium ещё не подключены, D14 запрещает
    # рефакторинг вне ТЗ item'а); независимо обоснованный `shm_size` для `postgres` — ниже.
    shm_size: '2gb'
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "horizon"]
    secrets:
      - app_key
      - db_password
      - redis_password
      - minio_root_password
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status 2>/dev/null | grep -qiE 'running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment: *prod_env
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - agelto_network

  scheduler:
    image: agelto/app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    secrets:
      - app_key
      - db_password
      - redis_password
      - minio_root_password
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment: *prod_env
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - agelto_network

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: agelto_postgres:17-partman
    restart: unless-stopped
    # P7.4 (F-10/F-11/F-12) — те же параметры и то же обоснование, что `docker-compose.yml`
    # (правило 7 item'а: расширения/параметры одинаковы в dev и prod).
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "statement_timeout=600000"
      - "-c"
      - "idle_in_transaction_session_timeout=300000"
      - "-c"
      - "log_min_duration_statement=1000"
    shm_size: '512mb'
    ports:
      - "127.0.0.1:${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # P7.7 (D33) — bind-mount под `make db:backup` (pg_dump + restore-check,
      # docker/postgres/backup-and-verify.sh): дамп виден на ХОСТЕ (`./storage/backups`),
      # переживает пересоздание контейнера. Off-host копирование/ротация/расписание cron —
      # инфра-решение владельца, Scope Excluded этого item'а.
      - ./storage/backups:/backups
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durability D34 (plans/EST-AI/plan.md; research/L finding 3): дефолтный redis:7-alpine
    # без конфига живёт только на периодических RDB-снапшотах — crash/OOM Redis теряет
    # очередь Horizon (до часа работы пайплайна). AOF everysec — канон 2026 (durability/
    # производительность); noeviction — очередь задач, ключи нельзя вытеснять под
    # memory-pressure как обычный кэш.
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/entrypoint.sh:/usr/local/bin/agelto-redis-entrypoint:ro
    secrets:
      - redis_acl
    entrypoint: ["/usr/local/bin/agelto-redis-entrypoint"]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agelto}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

networks:
  agelto_network:
    driver: bridge

volumes:
  pgsql_data:
  redis_data:
  minio_data:
  app_storage:

secrets:
  app_key:
    file: ./local/secrets/app_key
  db_password:
    file: ./local/secrets/db_password
  redis_password:
    file: ./local/secrets/redis_password
  redis_acl:
    file: ./local/secrets/redis_acl
  minio_root_password:
    file: ./local/secrets/minio_root_password
