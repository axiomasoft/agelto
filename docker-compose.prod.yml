version: "3.9"

services:
  app:
    image: agelto/app:latest
    container_name: agelto_app
    restart: unless-stopped
    working_dir: /var/www/html
    shm_size: '2gb'
    ports:
      - "${APP_PORT:-8081}:8080"
    environment: &prod_env
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ agelto_network ]

  horizon:
    image: agelto/app:latest
    container_name: agelto_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    shm_size: '2gb'
    command: ["php", "artisan", "horizon"]
    environment: *prod_env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ agelto_network ]

  reverb:
    image: agelto/app:latest
    container_name: agelto_reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *prod_env
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }
    networks: [ agelto_network ]

  # Добавь это в прод-файл, чтобы работали задачи по расписанию
  scheduler:
    image: agelto/app:latest
    container_name: agelto_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *prod_env
    depends_on:
      app: { condition: service_started }
    networks: [ agelto_network ]

  mysql:
    image: mysql:8.4
    container_name: agelto_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ agelto_network ]

  redis:
    image: redis:alpine
    container_name: agelto_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ agelto_network ]

networks:
  agelto_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
