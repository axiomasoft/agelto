services:
  app:
    user: "0:0"
    build:
      context: ./docker/php
    container_name: agelto_app
    restart: unless-stopped
    working_dir: /var/www/html
    stop_signal: SIGTERM
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${APP_PORT:-8081}:80"
      - "${VITE_PORT:-5174}:${VITE_PORT:-5174}"
    extra_hosts:
      - "eis-auth.local:192.168.1.10"
      - "eis-api.local:192.168.1.10"
      - "host.docker.internal:host-gateway"
    environment: &app_env
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - agelto_network
    shm_size: '2gb'

  # Контейнер для ручного запуска парсинга (Stage 1)
  worker-eis-parser-map:
    build:
      context: ./docker/php
    container_name: agelto_worker_eis_map
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./:/var/www/html
    environment: *app_env
    depends_on:
      - app
    networks:
      - agelto_network
    shm_size: '2gb'

  # Управление очередями (Stage 2, 3, 4)
  horizon:
    build:
      context: ./docker/php
    container_name: agelto_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    stop_signal: SIGTERM
    stop_grace_period: 610s
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "horizon"]
    environment: *app_env
    depends_on:
      - app
      - redis
    networks:
      - agelto_network
    shm_size: '2gb'

  scheduler:
    build:
      context: ./docker/php
    container_name: agelto_scheduler
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "schedule:work"]
    environment: *app_env
    depends_on: [ app ]
    networks:
      - agelto_network

  reverb:
    build:
      context: ./docker/php
    container_name: agelto_reverb
    restart: unless-stopped
    stop_signal: SIGTERM
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=${REVERB_PORT:-8000}"]
    ports:
      - "${REVERB_PORT:-8000}:${REVERB_PORT:-8000}"
    environment: *app_env
    depends_on: [ app, redis ]
    networks:
      - agelto_network

  redis:
    image: redis:alpine
    container_name: agelto_redis
    networks:
      - agelto_network

  mysql:
    image: mysql:8.4
    container_name: agelto_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agelto_network

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1300
  agelto_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
