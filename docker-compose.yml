name: agelto_v2

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      network: host
    container_name: agelto_app
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    working_dir: /var/www/html
    # storage/app и storage/logs — bind-mount с хоста (не именованный volume), поэтому при
    # смене владельца на хосте нужен разовый `docker compose exec -u root app chown -R
    # www-data:www-data storage`: у serversideup/php:8.4-fpm-nginx НЕТ PUID/PGID-ремаппинга
    # www-data под хостовой uid (в отличие от some других образов) — проверено, в
    # entrypoint.d нет PUID-логики, только PHP_FPM_CHILD_PROCESS_USER/_GROUP (задают
    # FPM-пул, не системного пользователя).
    volumes:
      - ./:/var/www/html
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    ports:
      - "${APP_PORT:-8080}:8080"
    environment: &app_env
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      # APP_URL — только из смонтированного .env: иначе значение «застывает» при create контейнера.
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agelto}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-agelto}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - agelto_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      network: host
    container_name: agelto_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status 2>/dev/null | grep -qiE 'running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agelto_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      network: host
    container_name: agelto_scheduler
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - agelto_network

  postgres:
    image: postgres:17-alpine
    container_name: agelto_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  redis:
    image: redis:7-alpine
    container_name: agelto_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  minio:
    image: minio/minio:latest
    container_name: agelto_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agelto}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  # Задел под Фазу 8 (research/tz-v2/playwright-service.md): будущий Node+Playwright
  # рендер-сервис для площадок с клиентским рендерингом. Для ЕИС HTTP-first достаточен
  # (см. 02-crawling.md) — сервис НЕ на критическом пути, здесь только пустой контейнер.
  browser:
    image: node:22-alpine
    container_name: agelto_browser
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]
    networks:
      - agelto_network

networks:
  agelto_network:
    driver: bridge

volumes:
  pgsql_data:
  redis_data:
  minio_data:
  app_bootstrap_cache:
  app_storage_framework:
