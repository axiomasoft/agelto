services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_app
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-upload.ini
    ports:
      - "${APP_PORT:-8080}:8080"
    extra_hosts:
      - "eis-auth.local:192.168.1.10"
      - "eis-api.local:192.168.1.10"
      - "host.docker.internal:host-gateway"
    environment: &app_env
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      # APP_URL только из смонтированного .env: иначе значение «застывает» при create контейнера.
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8000}
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - agelto_network

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_vite
    user: "0:0"
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-lc", "yarn install && yarn dev -- --host=0.0.0.0 --port=${VITE_PORT:-5173}"]
    volumes:
      - ./:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
    networks:
      - agelto_network

  docs:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_docs
    user: "0:0"
    restart: unless-stopped
    working_dir: /var/www/html
    command:
      [
        "sh",
        "-lc",
        "yarn install --frozen-lockfile && yarn vitepress build docs && php -S 0.0.0.0:${DOCS_PORT:-4173} -t docs/.vitepress/dist",
      ]
    volumes:
      - ./:/var/www/html
      - docs_node_modules:/var/www/html/node_modules
    ports:
      - "${DOCS_PORT:-4173}:${DOCS_PORT:-4173}"
    environment: *app_env
    networks:
      - agelto_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    shm_size: '2gb'
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status 2>/dev/null | grep -qiE 'running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agelto_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_scheduler
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "schedule:work"]
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - agelto_network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agelto_reverb
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["/usr/local/bin/docker-php-serversideup-entrypoint"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=${REVERB_SERVER_PORT:-8000}"]
    ports:
      - "${REVERB_SERVER_PORT:-8000}:${REVERB_SERVER_PORT:-8000}"
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - agelto_network

  pgsql:
    image: postgis/postgis:16-3.4-alpine
    container_name: agelto_pgsql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

  redis:
    image: redis:7-alpine
    container_name: agelto_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agelto_network

networks:
  agelto_network:
    driver: bridge

volumes:
  pgsql_data:
  redis_data:
  vite_node_modules:
  docs_node_modules:
